services:
  postgres:
    image: postgres:16-alpine
    container_name: smtp-postgres
    environment:
      POSTGRES_USER: smtp
      POSTGRES_PASSWORD: smtp
      POSTGRES_DB: smtp
    # Host port 5433 — 5432 is already taken by a native Postgres install on Windows.
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smtp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: smtp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: smtp-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: smtpminio
      MINIO_ROOT_PASSWORD: smtpminio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Optional: MailHog gives us a fake SMTP sink for dev before our own sandbox exists.
  # Remove once phase 1 (our own SMTP catcher) is running.
  mailhog:
    image: mailhog/mailhog:latest
    container_name: smtp-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  redis_data:
  minio_data:
