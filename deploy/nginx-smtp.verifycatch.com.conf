# /etc/nginx/sites-available/smtp.verifycatch.com
#
# Serves the built React dashboard from disk, proxies /api/* to the NestJS app on 127.0.0.1:4000.
# Certbot appends the HTTPS server block automatically on first `certbot --nginx` run.

server {
    listen 80;
    listen [::]:80;
    server_name smtp.verifycatch.com;

    root /opt/smtp-app/apps/web/dist;
    index index.html;

    client_max_body_size 30M;

    # API + auth + everything under /api/ → NestJS
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Static React app — SPA fallback so client-side routes work on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint that stays HTTP for LB / monitoring — nginx-level, no proxy.
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }
}
